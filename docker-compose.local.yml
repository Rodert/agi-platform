name: agi-platform-local

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-agi_platform}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-agi}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-agi123456}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - local_mysql_data:/var/lib/mysql
      - ./backend/scripts:/bootstrap:ro
      - ./deploy/mysql-init.sh:/docker-entrypoint-initdb.d/000_init.sh:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: golang:1.23-alpine
    working_dir: /workspace
    command: sh -c "go mod download && go run ./cmd/api"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${LOCAL_MYSQL_USER:-agi}
      DB_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-agi123456}
      DB_NAME: ${LOCAL_MYSQL_DATABASE:-agi_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${LOCAL_JWT_SECRET:-local-development-secret-change-before-production}
      SUPER_ADMIN_USERNAME: ${LOCAL_SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${LOCAL_SUPER_ADMIN_PASSWORD:-local-admin-password}
      SUPER_ADMIN_NAME: ${LOCAL_SUPER_ADMIN_NAME:-本地超级管理员}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./backend:/workspace
      - local_go_pkg:/go/pkg
      - local_uploads:/workspace/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: golang:1.23-alpine
    working_dir: /workspace
    command: sh -c "go mod download && go run ./cmd/worker"
    environment:
      APP_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${LOCAL_MYSQL_USER:-agi}
      DB_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-agi123456}
      DB_NAME: ${LOCAL_MYSQL_DATABASE:-agi_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${LOCAL_JWT_SECRET:-local-development-secret-change-before-production}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./backend:/workspace
      - local_go_pkg:/go/pkg
      - local_uploads:/workspace/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev:web --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./frontend:/workspace
      - local_frontend_node_modules:/workspace/node_modules
      - local_frontend_app_node_modules:/workspace/apps/web/node_modules
      - local_pnpm_store:/pnpm/store
    depends_on:
      - api

  admin:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./admin:/workspace
      - local_admin_node_modules:/workspace/node_modules
      - local_pnpm_store:/pnpm/store
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${LOCAL_HTTP_PORT:-3100}:80"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - admin

volumes:
  local_mysql_data:
  local_redis_data:
  local_uploads:
  local_go_pkg:
  local_pnpm_store:
  local_frontend_node_modules:
  local_frontend_app_node_modules:
  local_admin_node_modules:
