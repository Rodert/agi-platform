server:
  name: agi-platform-backend
  env: development
  port: 8080
  debug: true
  read_timeout: 60
  write_timeout: 60

database:
  host: localhost
  port: 3306
  user: root
  password: root
  database: agi_platform
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  log_level: info

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: your-secret-key-change-in-production
  expire_hours: 168

# 注意：对象存储、邮箱配置、支付配置、AI模型配置已移至数据库
# 请在管理后台的"系统配置"中进行配置
# 对应数据库表: storage_configs, email_config, payment_channels, ai_models

system:
  max_upload_size: 5242880  # 5MB
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
    - http://127.0.0.1:5173
  rate_limit_per_minute: 60

worker:
  concurrency: 10
  queue_name: agi:tasks
  redis_stream: agi:stream:tasks
