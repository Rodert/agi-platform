version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: agi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agi_platform
      MYSQL_USER: agi
      MYSQL_PASSWORD: agi123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - agi-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: agi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agi-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: agi-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - agi-network

  # API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: agi-api
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=agi
      - DB_PASSWORD=agi123
      - DB_NAME=agi_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_ENDPOINT=minio:9000
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - agi-network
    restart: unless-stopped

  # Worker 服务
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: agi-worker
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=agi
      - DB_PASSWORD=agi123
      - DB_NAME=agi_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_ENDPOINT=minio:9000
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - agi-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  agi-network:
    driver: bridge
