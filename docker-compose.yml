name: agi-platform

services:
  mysql:
    image: mysql:8.0
    container_name: agi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agi_platform}
      MYSQL_USER: ${MYSQL_USER:-agi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts:/bootstrap:ro
      - ./deploy/mysql-init.sh:/docker-entrypoint-initdb.d/000_init.sh:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [agi-network]

  redis:
    image: redis:7-alpine
    container_name: agi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [agi-network]

  app:
    image: ${APP_IMAGE:-agi-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agi-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-agi}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-agi_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      UPDATE_ENABLED: ${UPDATE_ENABLED:-false}
      UPDATE_AGENT_URL: http://updater:8090
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-}
      UPDATE_IMAGE_REPOSITORY: ${UPDATE_IMAGE_REPOSITORY:-ghcr.io/rodert/agi-platform}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-3012}:80"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--output-document=/dev/null", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [agi-network]

  updater:
    profiles: ["update"]
    build:
      context: .
      dockerfile: deploy/update-agent/Dockerfile
    container_name: agi-updater
    restart: unless-stopped
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:-disabled}
      UPDATE_IMAGE_REPOSITORY: ${UPDATE_IMAGE_REPOSITORY:-ghcr.io/rodert/agi-platform}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro
    networks: [agi-network]

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  agi-network:
    driver: bridge
