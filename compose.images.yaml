services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agi_platform}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    image: crpi-4otucz63tm2q5dhq.cn-beijing.personal.cr.aliyuncs.com/project-shiyu/agi-platform-server:latest
    restart: unless-stopped
    pull_policy: always
    environment:
      APP_ENV: prod
      APP_NAME: agi-platform
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: ${SERVER_PORT:-18082}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agi_platform}
      MYSQL_CHARSET: utf8mb4
      MYSQL_PARSE_TIME: "true"
      MYSQL_LOC: Local
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-604800}
      REGISTER_GIFT_CREDITS: ${REGISTER_GIFT_CREDITS:-100}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-cos}
      STORAGE_LOCAL_ROOT: /app/uploads
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-agi-platform-dev-1257142189}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-https://agi-platform-dev-1257142189.cos.ap-guangzhou.myqcloud.com}
      COS_UPLOAD_PREFIX: ${COS_UPLOAD_PREFIX:-}
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-18082}:${SERVER_PORT:-18082}"
    volumes:
      - server-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  server-uploads:
