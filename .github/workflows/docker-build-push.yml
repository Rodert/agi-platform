name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: crpi-4otucz63tm2q5dhq.cn-beijing.personal.cr.aliyuncs.com
  REGISTRY_NAMESPACE: project-shiyu

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: server
            context: .
            dockerfile: server/Dockerfile
            image: agi-platform-server
            build_args: ""
          - name: user-web
            context: .
            dockerfile: web/Dockerfile
            image: agi-platform-user-web
            build_args: |
              APP_NAME=user
              VITE_API_BASE_URL=${{ vars.USER_WEB_API_BASE_URL || vars.VITE_API_BASE_URL || 'http://127.0.0.1:8080' }}
          - name: admin-web
            context: .
            dockerfile: web/Dockerfile
            image: agi-platform-admin-web
            build_args: |
              APP_NAME=admin
              VITE_API_BASE_URL=${{ vars.ADMIN_WEB_API_BASE_URL || vars.VITE_API_BASE_URL || 'http://127.0.0.1:8080' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
